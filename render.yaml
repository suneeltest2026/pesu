# Render blueprint — one web service, one persistent disk.
# The disk holds both the SQLite database and uploaded product images, so
# nothing is lost on redeploy.
services:
  - type: web
    name: pesu
    runtime: node
    plan: starter          # a persistent disk requires a paid instance type
    buildCommand: npm ci
    # Seeding happens at start, not at build: the persistent disk is only
    # mounted at runtime, so a build-time seed would be written to a
    # throwaway filesystem and the live site would boot with no catalogue.
    # The seeder upserts, so running it on every boot is safe.
    startCommand: npm run seed && npm start
    healthCheckPath: /
    disk:
      name: pesu-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/pesu.db
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: UPLOADS_PATH
        value: /var/data/images
